[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fas-academic-data-api"
version = "0.1.0"
description = "FAS WUSL Academic Data API"
requires-python = ">=3.10"
dependencies = [
    "FastAPI==0.104.1",
    "uvicorn==0.24.0.post1",
    "SQLAlchemy==2.0.23",
    "alembic==1.13.0",
    "psycopg2-binary==2.9.9",
    "pydantic==2.5.2",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
    "parser/tests"
]
pythonpath = [
    ".",
    "parser/src"
]

[tool.setuptools.packages.find]
include = ["api*", "database*", "crawler*", "parser*"]
