name: Academic Data Synchronization

on:
  schedule:
    - cron: '0 2 * * *' # Run daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no database writes)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    name: Synchronize FAS Data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies (OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          # Add any other required OCR/PDF packages if needed, e.g. libgl1 for cv2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ingestion.txt

      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        if: ${{ !inputs.dry_run }}
        run: |
          PYTHONPATH=. alembic upgrade head

      - name: Run Academic Data Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          
          PYTHONPATH=. python scripts/run_academic_data_sync.py $DRY_RUN_FLAG > sync_output.log 2>&1
          SYNC_EXIT_CODE=$?
          
          # Print the log for GH Actions runner output
          cat sync_output.log
          
          # Generate Summary
          echo "## Synchronization Summary" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          tail -n 10 sync_output.log >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          if [ $SYNC_EXIT_CODE -ne 0 ]; then
            echo "❌ **Sync failed with exit code $SYNC_EXIT_CODE**" >> $GITHUB_STEP_SUMMARY
            exit $SYNC_EXIT_CODE
          else
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "✅ **Dry-run completed successfully.**" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ **Sync completed successfully.**" >> $GITHUB_STEP_SUMMARY
            fi
          fi
